name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python-headless pillow numpy pandas matplotlib onnx onnxruntime fastapi python-multipart httpx pytest
      - name: Tests (unit + end-to-end on synthetic data)
        run: pytest -q
